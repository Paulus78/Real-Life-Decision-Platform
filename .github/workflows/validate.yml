name: Repository CI & Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check file structure & integrity
        run: |
          echo "Verifying essential AI collaboration files..."
          test -f CLAUDE.md || (echo "CLAUDE.md missing!" && exit 1)
          test -f CHATGPT.md || (echo "CHATGPT.md missing!" && exit 1)
          test -f DECISION_LOG.md || (echo "DECISION_LOG.md missing!" && exit 1)
          test -f PROJECT_STATUS.md || (echo "PROJECT_STATUS.md missing!" && exit 1)
          echo "All core files present and accounted for."
